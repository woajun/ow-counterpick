name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 밀린 것이 있으면 최신 것만 나간다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # yarn 을 건드리는 것은 전부 corepack 을 켠 다음에 와야 한다.
      # setup-node 의 `cache: yarn` 은 캐시 폴더를 알아내려고 yarn 을 먼저
      # 실행하는데, packageManager 가 yarn@3.6.4 로 선언돼 있어서 그 호출이
      # 아직 준비 안 된 corepack 을 깨우고 거기서 죽는다. 의존성이 몇 개
      # 안 되니 캐시는 포기하고 순서를 지킨다.
      #
      # 런너에 미리 깔린 corepack 은 yarn 을 내려받을 때 서명 검증이
      # 깨지는 버전이라 먼저 올린다.
      - run: npm install -g corepack@latest
      - run: corepack enable

      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
