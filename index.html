<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="적 팀 조합을 고르면 유리한 스왑 후보와 피해야 할 픽을 바로 보여 주는 오버워치 상성 도구."
    />
    <title>오버워치 카운터픽</title>

    <!-- 링크 미리보기(디스코드 · 카톡 · 트위터). 서버가 없어서 사람마다 다른 카드는
         못 만들고 모두 같은 카드다. 그림은 scripts/make_og.py 가 만든다.
         og:image 는 절대 주소여야 한다 — 도메인을 바꾸면 여기도 바꾼다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="오버워치 카운터픽" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="오버워치 카운터픽" />
    <meta
      property="og:description"
      content="적 조합을 고르면 유리한 스왑이 바로 나와요. 해설자 · 스트리머의 상성을 따라가 보세요."
    />
    <meta property="og:url" content="https://woajun.github.io/ow-counterpick/" />
    <meta property="og:image" content="https://woajun.github.io/ow-counterpick/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="오버워치 카운터픽 — 추천 픽과 점수 막대" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
